name: تحديث المحتوى يومياً

on:
  schedule:
    - cron: '0 3 * * *'      # كل يوم ٣ صباحاً بتوقيت جرينتش (٦ صباحاً بتوقيت مكة)
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: بناء ملف المحتوى
        run: python build_feed.py

      - name: حفظ التحديث
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git diff --staged --quiet || git commit -m "تحديث المحتوى اليومي"
          git push
