<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>رادار بايثون</title>
<meta name="description" content="محتوى برمجة بايثون بالعربي والإنجليزي، محدّث يومياً">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رادار بايثون">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">رادار <span>بايثون</span></h1>
    <button id="btn-refresh" class="icon-btn" aria-label="تحديث">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search"
           placeholder="ابحث… مثال: جانغو، pandas، تعلم بايثون" autocomplete="off">
    <button id="btn-clear" class="clear-btn" hidden aria-label="مسح">&times;</button>
  </div>

  <nav class="chips" id="lang-chips" aria-label="اللغة">
    <button class="chip is-on" data-lang="all">الكل</button>
    <button class="chip" data-lang="ar">عربي</button>
    <button class="chip" data-lang="en">إنجليزي</button>
    <button class="chip" data-lang="saved">★ المحفوظات</button>
  </nav>

  <nav class="chips scroll-x" id="source-chips" aria-label="المصدر"></nav>
</header>

<main>
  <div id="status" class="status" role="status"></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden>
    <p>لا توجد نتائج مطابقة.</p>
    <button class="btn-ghost" id="btn-reset">إظهار كل المصادر</button>
  </div>
  <button id="btn-more" class="btn-more" hidden>عرض المزيد</button>
</main>

<footer class="foot">
  <span id="meta"></span>
  <button id="btn-install" class="btn-ghost" hidden>كيف أضيفه للشاشة الرئيسية؟</button>
</footer>

<dialog id="install-dlg">
  <h2>إضافة التطبيق للآيفون</h2>
  <ol>
    <li>افتح الصفحة في متصفح <b>Safari</b>.</li>
    <li>اضغط زر المشاركة <b>􀈂</b> في الأسفل.</li>
    <li>اختر <b>إضافة إلى الشاشة الرئيسية</b>.</li>
  </ol>
  <p class="hint">بعدها يفتح بملء الشاشة كأي تطبيق، ويحدّث المحتوى تلقائياً كل يوم.</p>
  <form method="dialog"><button class="btn">تمام</button></form>
</dialog>

<script src="app.js"></script>
</body>
</html>
